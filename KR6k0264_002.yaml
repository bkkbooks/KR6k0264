body:
  text: 同譯經西天寶法大師賜紫沙門臣智吉祥等奉詔譯爾時恭敬寂靜自在天子復白妙吉祥童真菩薩毗奈耶法有其幾種使諸衆生云何修習漸次證入諸佛智慧唯願大慈為我等輩宣説清淨解脫法門時妙吉祥童真菩薩告天子言我聞寶幢如來所説毗奈耶法本性平等體無有異由佛如來隨順衆生根性頓漸方便開示禁禦有情假立多種所謂法界無邊衆生無邊戒亦無邊衆生無始慣習熏修於情非情迷惑顛倒於違順境起憎愛心妄結業因自沈流轉故佛世尊隨冝開導戒律因緣稱彼物機各生意樂譬如清淨摩尼寶珠應順人心現種種物各得隨時濟自所乏此毗奈耶亦復如是隨諸衆生之所受持見在未來得如意報又如世間海水深廣於諸川澤無不含容一切有情一切珠寶依之而住此毗奈耶亦復如是隨諸衆生樂欲差別故分諸乘受持有異任其種性各得所依功德珍寶皆悉具足故毗奈耶是諸衆生一切善法依止住處世尊大慈平等利益觀諸衆生猶如一子為人天性説三歸五戒如乘小筏得渡溝河近達彼岸人天乘此善戒功力超越三塗煩惱業水為聲聞人受毗奈耶是趣大乘基址聖道隨心説戒戒無差別逐境論心戒成無量為聖性人略説二種毗奈耶法謂即聲聞及與菩薩是二種戒力用不同故成別異聲聞所行唯專自行不務利他見苦有情心無悲愍不生救護菩薩修習己益物於自身命眷屬財寶為守淨戒無少吝惜不憚寒暄積集善利冤親相對歡喜普滋不作順違慈心攝受又聲聞人猒畏生死求自涅盤知苦斷集證滅修道遠離憒閙愛樂空寂菩薩用心不怖生死不住涅盤願於惡時安立正道又聲聞人於魔魔民唯求捨離不樂任持菩薩勝行見諸極惡邪行有情方便調伏軟言攝受令捨邪道為自眷屬又諸聲聞於所受持毗奈耶法猶如世間陶石之器或有破壞不能復完如多羅無心不復生長針鼻折缺匪堪重用人斷其頭無能還活菩薩戒法體性如金成其寶器設有所性有堪任體本金故還復成用又聲聞人雖以堅持作無作戒而於十力四無所畏未有所證唯菩薩人漸次修習如來福慧汝善男子諸聲聞人於菩薩法不得自在身為相纍心被境縛由持淨戒定慧見前自乘聖因雖皆成就於究竟道最上菩提而未證得與諸菩薩所有戒定智慧勝力功德道品不可為比説是語已爾時世尊讚歎妙吉祥童真菩薩善哉善哉汝善學佛宣説聲聞菩薩所有清淨毗奈耶法令諸衆生隨自根心各有修證善男子此毗奈耶功德甚深不可思議我今為汝及諸大衆重略宣説清淨最上祕密尸羅令各了知持犯名相漸次證入諸佛智慧汝善男子天人衆會殷勤恭敬諦聽思惟此清淨法三世諸佛之所尊重三世菩薩之所隨學諸佛菩薩所有微妙福德智慧皆從此生若但聞名少時信受亦獲十種殊勝功德一者智慧具足二者依佛隨學三者深信大乘四者善願堅固五者心不散亂六者遠離惡報七者常遇善緣八者心無纏染九者三昧現前十者得成佛道暫修少善獲果尚多何況長時心無退捨善男子此清淨法衆聖源流諸佛根本喻如大海水無邊際大身衆生歡喜愛樂長時遊戲心無猒足菩薩所行毗奈耶法體性深廣用無邊際功無限量菩薩愛樂終無猒捨世間所有陂池之水有情在中雖以為樂水本淺近不久枯涸大身衆生甚不樂住其有細流漸入大海咸同一味聲聞所持毗奈耶法非菩薩人之所愛樂亦復能為佛果正因名相有殊體實無異于時會中一萬二千諸天子衆聞佛世尊方便譬喻種種讚歎微妙甚深毗奈耶法皆各發起阿耨多羅三藐三菩提心頂禮世尊俱唱是言我等今者皆願當學摩訶薩埵根本聖因教化衆生令各調伏根識清淨漸次修行至如來地爾時世尊告天子言汝等往昔已曾親近供養諸佛於菩薩乘久植善本欲學最上清淨毗尼必得成就應當發起精進勇猛堅固道心不被煩惱之所纏縛五欲幻相深生猒捨了知貪愛生死苦源覺悟無明輪回根本密護諸根堅意不犯初中後夜正念現前邪見妄心不能迷亂我人衆生及與壽命自性本空五陰六塵和合聚散尋伺覺觀分別緣生而無實體如是天子應當了知過現未來世出世間一切諸法本性平等猶若虛空究竟寂靜爾時恭敬寂靜自在天子白佛言世尊今此會中是妙吉祥童真菩薩善能宣説一切法要令諸衆生各有開解於最上乘毗奈耶法漸次修學方便悟入我今復欲問彼菩薩如來所有因地行願平等清淨解脫法門唯願世尊慈悲憐愍聽我咨問摩訶衍曩最上法義使我等輩及於未來一切衆生戒見具足不墮邪命爾時世尊讚歎寂靜自在天子言善哉善哉能以方便利樂衆生今正是時冝應請問于時天子承佛威力歡喜踴躍詣妙吉祥大菩薩前嚴整衣冠威儀具足五輪踞地殷勤作禮禮已讚言仁者大士我今咨問如來所有諸法之要以何為門令諸衆生入如來家得正覺道唯願慈悲為我等輩開示演説于時菩薩在大衆中身放光明容貌怡恱端正殊妙威德特尊振大雷音作師子吼告天子言如汝所問諦聽思惟世尊大慈正遍知者證知我今為汝略説善男子一切衆生從本已來迷惑顛倒不覺正因增長我人妄搆生滅由貪嗔癡為生滅體如繩縛物無有自在永繫三界遠無出期深處塵勞不得清淨故於法門無所悟入善男子一切諸法本性平等無有高下愛憎之相無別法性成多衆生非多衆生有別法性故衆生法即如來法故衆生性即如來性能如是知能如是信於諸法性不生疑謗以此為門入如來家得正覺道名真佛子精勤修習植衆善本漸次除斷煩惱蓋纏初中後夜心常醒覺密護根門無令放逸識生滅相了知我法名義俱空假合幻緣不能迷動如是修習是諸菩薩真實平等解脫法門善男子一切衆生顛倒既久煩惱愈增失於如來律儀淨戒四攝六度無以見前於真實法不深愛樂自興異見邪妄推度朋黨惡人憍慢懈怠恣情縱意橫搆業緣植流轉根造生死本因果不斷惑苦相續念念交遷無得安隱不覺自身諸根四大假和合成藉因緣有因緣勢在假名呼召住世時分猶如幻人來往動轉緣勢力盡四大散滅身相歸空當知住世色力眷屬如夢所見名體非實是名衆生虛妄顛倒入生死門善男子一切衆生從無始來慣習慳吝於自內身不行惠捨唯深耽染晝夜愛著俄尓無常不復暫住如寄舍人屋宇敗壞別寄他舍色身敗壞心識隨緣異趣寄生惟留殘軀空成濃血何可愛著復於外財金帛錢寶計念鄙惜無片捨心不知此物本性聚散流轉世間妄恃豪富遠待長年不續善因恣情娛樂福緣殆盡水火風災劫掠時至財物耗散眷屬別離見受餘殃後沉惡道因果感應永處貧乏由內外物不行布施於七聖財無復能得諸大菩薩於自內身眷屬財寶無所吝惜見有求者如法施與是名菩薩布施法門善男子一切衆生從無始來隨逐魔道不護諸根縱貪嗔癡違越梵行於三寶所無敬信心不樂律儀唯行放逸喜煞衆生習不與取好處汙行言不真實飲噉非食嘗無猒足聲聞緣覺菩薩大人作無作戒曾不親近人天善法亦不修習來往三塗無有間斷諸大菩薩於佛所説毗奈耶法清淨禁戒乃至無有如毛頭許而不信受是名菩薩淨戒法門善男子衆生無始惑於法性於無我處妄執我人嗔恚見行相續嫉妬常懷諍訟惱有情遇苦違緣復加逆害諸大菩薩於我及所了知為空設遇冤家欲相謀害以憐愍心歡喜隨順不生加報是名菩薩忍辱法門善男子一切衆生從本已來身心懈怠著諸垢穢退失善法五欲醉亂常無醒覺親近惡友違善知識於諸如來一百四十不共功德清淨法門不能隨學於諸菩薩自利利他饒益行門亦不了知於辟支迦十二因緣順逆觀行不能明解於聲聞人四聖諦法染淨因果無所趣入於人天乘世間善法無信向心唯積惡緣以增懈怠而諸菩薩由種性力心不怯弱人天二乘菩薩如來所有上行發勇猛心遍勤修習雖遭衆苦終無悔惱是名菩薩精進法門善男子一切衆生心意狂亂晝夜放逸種種覺觀於諸塵境念念隨逐若身若心曾不安息菩薩摩訶薩由修淨戒禁禦六根深入禪那身心寂靜是名菩薩禪定法門善男子一切衆生愚癡暗鈍多無知覺於佛所説三十七品四無量道慈心濟物與樂法門悲愍一切苦惱衆生拔苦法門其性柔和愛樂衆生喜恱法門遠離憎愛無冤親想平等法門身受心法四念安住無我法門修四正斷遠離障染清淨法門備四神足輕舉動轉運通法門具五善根增長功德出生法門五力圓具破諸魔冤摧伏法門七覺支分八聖道品淨功德門皆不曉了而諸菩薩具足修習福德智慧於修多羅毗奈耶法及阿毗曇悉能深解是名菩薩智慧法門爾時寂靜自在天子聞妙吉祥童真菩薩所説種種清淨法門發希有心堅固不捨以柔軟音復問菩薩仁者大士云何名為法界性門菩薩答言善男子一切諸法有為無為體用周遍無所不攝名法界門又問法界以何為界答天子言謂有情界及無情界為一法界重復問言如是法界有邊際不菩薩告言汝意云何如虛空界有邊際不答言不也菩薩告言虛空無邊大地無邊衆生無邊法界無邊天子問言仁者大士此法界性可分別不菩薩答言法界性者不住於色不住於聲不即衆生不異衆生寂靜湛然遍一切處絶諸戲論法界之名本亦不有天子問言仁者大士具修幾緣有如是心辨才分別能説諸法童真菩薩告天子言汝見世間幽巖山谷有幾種心出諸音響而應外聲天子答言山谷無心猶外有聲相合生響菩薩告言我今亦尓我本無心分別諸法隨衆生性應緣所説天子問言仁者大士為依何住速能成就阿耨多羅三藐三菩提童真菩薩答天子言菩薩修行住五種法無有間斷速能成就阿耨多羅三藐三菩提何等為五謂菩薩摩訶薩最初發起大菩提心殷勤勇猛志求佛道於其中間不起一念聲聞緣覺下劣之心是一無間菩薩摩訶薩最初發心救濟衆生而於自體身手支分眷屬財寶無所愛惜亦不能生暫時慳吝是二無間菩薩摩訶薩最初發起慈悲之心於諸衆生悉欲度脫其中未嘗少有懈廢是三無間菩薩摩訶薩最初發心修菩提行知一切法本無自性從緣而生從緣而滅決定信忍未嘗於中生諸異見是四無間菩薩摩訶薩始從初發大菩提心具正知見行平等道遠離空有斷常之病猒有漏法不著三界是五無間善男子菩薩摩訶薩住五無間生精進心速得成就阿耨多羅三藐三菩提法天子又問仁者大士頗有凡夫衆生住五無間亦能成就阿耨多羅三藐三菩提耶菩薩答言可得成就天子問言以何因緣而得成就菩薩答言於一切法了知為空無疑無謗作者受者俱無自相如是修習故得成就阿耨多羅三藐三菩提
